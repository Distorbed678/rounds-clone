# Builds and publishes a release when a version tag (v*) is pushed, so releases can be made from
# any machine (the AppImage can only be built on Linux). The release notes are the annotated tag's
# message; the download table and SHA-256 checksums are added here. Then the browser version is
# deployed: a release created with the workflow token doesn't trigger pages.yml by itself.
#
#   git tag -a vX.Y.Z --cleanup=verbatim -F notes.md && git push origin vX.Y.Z
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install build tools
        run: sudo apt-get update -q && sudo apt-get install -y -q zip unzip

      - name: Build packages
        run: ./build.sh all

      - name: Check packages
        run: |
          set -euo pipefail
          cd dist
          ./RoundsClone-x86_64.AppImage --appimage-extract > /dev/null
          for f in RoundsClone.love libsteam_api.so luasteam.so web/index.html web/love.wasm web/game.data; do
            test -s "squashfs-root/$f" || { echo "AppImage is missing $f"; exit 1; }
          done
          grep -q '^FUSE_PATH=' squashfs-root/AppRun
          files="$(unzip -Z1 RoundsClone-windows-x64.zip)"
          for f in RoundsClone.exe steam_api64.dll luasteam.dll web/index.html web/love.wasm web/game.data; do
            grep -qx "RoundsClone/$f" <<< "$files" || { echo "Windows zip is missing $f"; exit 1; }
          done
          rm -rf squashfs-root

      - name: Write release notes
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents)' "$TAG" | sed '/-----BEGIN PGP SIGNATURE-----/,$d' > notes.md
          cat >> notes.md <<'EOF'

          ## Downloads

          | Platform | File | How to run |
          |---|---|---|
          | Browser | — | https://distorbed678.github.io/rounds-clone/ |
          | Linux (x86-64) | `RoundsClone-x86_64.AppImage` | `chmod +x RoundsClone-x86_64.AppImage && ./RoundsClone-x86_64.AppImage` |
          | Windows (64-bit) | `RoundsClone-windows-x64.zip` | Unzip, then run `RoundsClone\RoundsClone.exe` (keep the DLLs next to it) |

          ## SHA-256
          EOF
          { echo '```'; (cd dist && sha256sum RoundsClone-windows-x64.zip RoundsClone-x86_64.AppImage); echo '```'; } >> notes.md
          cat notes.md

      - name: Publish release
        run: |
          gh release create "$TAG" dist/RoundsClone-x86_64.AppImage dist/RoundsClone-windows-x64.zip \
            --verify-tag --title "Rounds Clone $TAG" --notes-file notes.md

      - name: Deploy browser version
        run: gh workflow run pages.yml --ref "$TAG"
